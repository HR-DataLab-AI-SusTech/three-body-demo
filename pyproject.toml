[project]
name = "threebody"
version = "1.0.0"
description = "A three-body gravity playground with a rated gallery: the DataLab's app-hosting demo"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.3",
    "streamlit>=1.50",
    "plotly>=6.3",
    "sqlalchemy>=2.0.43",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "pydantic>=2.11",
    "scipy>=1.16",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13", "pyright>=1.1.405"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threebody"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N"]
ignore = ["S101"]  # assert is how pytest checks

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
