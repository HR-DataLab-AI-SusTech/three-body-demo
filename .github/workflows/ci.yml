# Checks on every pull request; on main, also the image (built, scanned, pushed, attested) and the
# deploy. Coolify's own deploy-on-push is off: nothing reaches the site without passing this file.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main halfway through a deploy; superseded PR runs may go.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/hr-datalab-ai-sustech/three-body-demo

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: threebody
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      # The database tests run against this, through the real Alembic migrations.
      DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/threebody
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: dependencies, exactly as locked
        run: uv sync --frozen
      - name: format
        run: uv run ruff format --check .
      - name: lint
        run: uv run ruff check .
      - name: types
        run: uv run pyright
      - name: tests (physics, and the gallery against PostgreSQL)
        run: uv run pytest -v -rs

  image:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build, for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: three-body-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: scan for known vulnerabilities (fails on a fixable high or critical one)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: three-body-demo:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push, with a provenance attestation and an SBOM
        id: push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: attest the build (verifiable with `gh attestation verify`)
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://threebody-pilot.apps.twinhub.nl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hand Coolify the compose pinned to this digest, then deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_URL: https://threebody-pilot.apps.twinhub.nl
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: bash .github/scripts/deploy-to-coolify.sh
