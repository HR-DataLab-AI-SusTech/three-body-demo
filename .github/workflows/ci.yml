# Checks on every push to main and every pull request. Coolify builds and deploys from GitHub by
# itself (docs/deploy-on-coolify.md); this file is the tests, not the deploy.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: threebody
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      # The database tests run against this, through the real Alembic migrations.
      DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/threebody
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: dependencies, exactly as locked
        run: uv sync --frozen
      - name: format
        run: uv run ruff format --check .
      - name: lint
        run: uv run ruff check .
      - name: types
        run: uv run pyright
      - name: tests (physics, and the gallery against PostgreSQL)
        run: uv run pytest -v -rs
