# What Coolify runs. Coolify clones this repository, builds the Dockerfile and starts the three
# services; the two ${SERVICE_PASSWORD_*} values are generated by Coolify and never written down.
services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://threebody:${SERVICE_PASSWORD_POSTGRES}@db:5432/threebody
      ADMIN_CODE: ${SERVICE_PASSWORD_ADMIN}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Brings the schema to the code's version before the app starts; exits when done.
  migrate:
    build: .
    # The schema first, then the presets into the gallery as featured setups.
    command: ["sh", "-c", "alembic upgrade head && python -m threebody.seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://threebody:${SERVICE_PASSWORD_POSTGRES}@db:5432/threebody
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    # Coolify: a one-shot job, not a service it should keep up or route to.
    labels:
      - coolify.proxy=false

  db:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: threebody
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: threebody
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threebody -d threebody"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
